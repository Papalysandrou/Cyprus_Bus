<title>Live Bus Map — Larnaka Nautical Club</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0b1a2e;font-family:'Arial Black',Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.top-bar{background:#0d2244;border-bottom:3px solid #00aaff;padding:12px 16px;}
.top-bar h1{color:#fff;font-size:16px;font-weight:900;letter-spacing:0.5px;}
.top-bar small{display:block;font-size:11px;color:#5a8ab0;margin-top:2px;}
.filters{display:flex;gap:8px;padding:10px 16px;background:#0a1628;overflow-x:auto;flex-shrink:0;border-bottom:1px solid #162e50;}
.filters::-webkit-scrollbar{display:none;}
.filter-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1.5px solid #2a4a7f;background:transparent;color:#5a8ab0;font-family:'Arial Black',Arial,sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;white-space:nowrap;}
.filter-btn.active{background:#00aaff;border-color:#00aaff;color:#0a1628;}
.filter-btn:hover{border-color:#00aaff;color:#00aaff;}
#map{flex:1;}
.legend{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#0d2244ee;border:1px solid #162e50;border-radius:10px;padding:10px 16px;display:flex;gap:16px;z-index:1000;backdrop-filter:blur(4px);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#5a8ab0;font-weight:700;}
.legend-dot{width:12px;height:12px;border-radius:50%;}
.no-buses-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#0d2244ee;border:1px solid #162e50;border-radius:10px;padding:20px 24px;text-align:center;z-index:1000;color:#5a8ab0;font-size:14px;font-weight:700;display:none;}

<div class="top-bar">
  <h1>🚌 Live Bus Tracker — Larnaka Nautical Club</h1>
  <small>Λάρνακα — Ναυτικός Όμιλος · Tap a bus line to filter</small>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" onclick="setFilter('ALL')">🚌 All Buses</button>
</div>

<div id="map"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#22dd55"></div> &lt; 5 min</div>
  <div class="legend-item"><div class="legend-dot" style="background:#00aaff"></div> 5–20 min</div>
  <div class="legend-item"><div class="legend-dot" style="background:#5a8ab0"></div> 20–40 min</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ff4444"></div> Stop</div>
</div>

<div class="no-buses-msg" id="noBusMsg">No buses in the next 40 minutes<br><span style="font-size:12px;font-weight:400;">Δεν υπάρχουν λεωφορεία</span></div>

const schedule = rawSchedule.map(r => ({
  line:r[0], en:r[1], gr:r[2], routeKey:r[3], h:r[4], m:r[5]
}));

let activeFilter = 'ALL';
let busMarkers = [];
let map;

function getMinsUntil(h, m) {
  const now = new Date();
  const then = new Date(now);
  then.setHours(h, m, 0, 0);
  return (then - now) / 60000;
}

function getBusPosition(routeKey, mins) {
  const dir = routeDirections[routeKey] || routeDirections['424'];
  // Interpolate: at 0 mins = at stop, at 40 mins = at full direction point
  const ratio = Math.min(mins / 40, 1);
  const lat = STOP_LAT + (dir.lat - STOP_LAT) * ratio;
  const lng = STOP_LNG + (dir.lng - STOP_LNG) * ratio;
  return [lat, lng];
}

function getColor(mins) {
  if (mins < 5) return '#22dd55';
  if (mins < 20) return '#00aaff';
  return '#5a8ab0';
}

function makeBusIcon(line, mins) {
  const color = getColor(mins);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44">
    <circle cx="22" cy="22" r="20" fill="${color}" opacity="0.25"/>
    <circle cx="22" cy="22" r="14" fill="${color}"/>
    <text x="22" y="27" text-anchor="middle" font-family="Arial Black,Arial" font-size="${line.length>3?8:10}" font-weight="900" fill="#0a1628">${line}</text>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [44, 44],
    iconAnchor: [22, 22],
    popupAnchor: [0, -22]
  });
}

function getVisible() {
  return schedule
    .map(b => ({ ...b, mins: getMinsUntil(b.h, b.m) }))
    .filter(b => b.mins > -1 && b.mins < 40)
    .filter(b => activeFilter === 'ALL' || b.line === activeFilter)
    .sort((a, b) => a.mins - b.mins);
}

function buildFilters() {
  const lines = [...new Set(schedule.map(b => b.line))].sort();
  const bar = document.getElementById('filters');
  lines.forEach(line => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = line;
    btn.onclick = () => setFilter(line);
    bar.appendChild(btn);
  });
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === f || (f==='ALL' && b.textContent==='🚌 All Buses'));
  });
  updateMarkers();
}

function updateMarkers() {
  busMarkers.forEach(m => map.removeLayer(m));
  busMarkers = [];

  const visible = getVisible();
  document.getElementById('noBusMsg').style.display = visible.length ? 'none' : 'block';

  visible.forEach(b => {
    const pos = getBusPosition(b.routeKey, b.mins);
    const minsText = b.mins < 1 ? 'NOW' : Math.round(b.mins) + ' min';
    const marker = L.marker(pos, { icon: makeBusIcon(b.line, b.mins) })
      .addTo(map)
      .bindPopup(`<b style="font-size:15px">Bus ${b.line}</b><br>${b.en}<br>${b.gr}<br><b style="color:${getColor(b.mins)}">${minsText}</b>`);
    busMarkers.push(marker);
  });
}

// Init map
map = L.map('map', { zoomControl: true }).setView([STOP_LAT, STOP_LNG], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {

  maxZoom: 19
}).addTo(map);

});
L.marker([STOP_LAT, STOP_LNG], {icon: stopIcon})
  .addTo(map)
  .bindPopup('<b>🚏 Nautical Club Stop</b><br>Ναυτικός Όμιλος');

buildFilters();
updateMarkers();
setInterval(updateMarkers, 30000);
