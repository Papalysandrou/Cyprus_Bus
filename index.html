<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0b1a2e;font-family:'Arial Black',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;}
.hdr{background:#0d2244;border-bottom:3px solid #00aaff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;}
.stop-name{color:#fff;font-size:22px;font-weight:900;letter-spacing:1px;}
.stop-name small{display:block;font-size:13px;font-weight:400;color:#5a8ab0;margin-top:3px;letter-spacing:0;}
.clock{color:#00aaff;font-size:36px;font-weight:900;letter-spacing:2px;text-align:right;}
.clock small{display:block;font-size:12px;color:#5a8ab0;font-weight:400;letter-spacing:0;text-align:right;}
.col-heads{display:grid;grid-template-columns:110px 1fr 180px;padding:8px 28px;background:#0d2244;border-bottom:1px solid #162e50;}
.col-heads span{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#3a6a90;text-transform:uppercase;}
.col-heads span:last-child{text-align:center;line-height:1.6;}
.row{display:grid;grid-template-columns:110px 1fr 180px;align-items:center;padding:0 28px;min-height:80px;border-bottom:1px solid #102035;}
.row:nth-child(odd){background:#0d1e38;}
.row:nth-child(even){background:#0b1a2e;}
.row.now-row{background:#0a2500 !important;border-left:4px solid #22dd55;border-bottom:1px solid #1a3a10;}
.line-num{font-size:38px;font-weight:900;color:#fff;}
.destination{padding:0 12px;}
.dest-en{font-size:20px;font-weight:700;color:#fff;}
.dest-gr{font-size:15px;color:#5a8ab0;margin-top:3px;}
.mins-col{text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;}
.mins-num{font-size:42px;font-weight:900;line-height:1;white-space:nowrap;}
.mins-now{color:#22dd55;font-size:22px;}
.mins-soon{color:#22dd55;}
.mins-later{color:#00aaff;}
.mins-far{color:#5a8ab0;}
.arrows{display:flex;flex-direction:column;align-items:center;line-height:0.85;color:#22dd55;font-size:26px;animation:bounce 0.6s infinite alternate;}
@keyframes bounce{from{transform:translateY(-3px);}to{transform:translateY(3px);}}
.footer{margin-top:auto;background:#0d2244;border-top:1px solid #162e50;padding:10px 28px;display:flex;align-items:center;justify-content:space-between;}
.footer-brand{font-size:12px;color:#3a6a90;font-weight:700;letter-spacing:1px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:#22dd55;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.page-indicator{display:flex;gap:6px;justify-content:center;padding:8px 0;background:#0b1a2e;}
.dot{width:8px;height:8px;border-radius:50%;background:#162e50;}
.dot.active{background:#00aaff;}
.no-buses{text-align:center;padding:60px 28px;color:#3a6a90;font-size:18px;font-weight:700;}
</style>

    <span id="clk">00:00</span>

<div class="page-indicator" id="dots"></div>

<div class="footer">
  <span class="footer-brand">🇨🇾 Cyprus Public Transport · Κυπριακές Δημόσιες Συγκοινωνίες</span>
  <span><span class="live-dot"></span>&nbsp;<span style="font-size:12px;color:#3a6a90;font-weight:700;">LIVE</span></span>

const schedule = rawSchedule.map(r => ({
  line: r[0], en: r[1], gr: r[2], h: r[3], m: r[4]
}));

const PAGE_SIZE = 4;
let currentPage = 0;
let pageTimer = null;

function getMinsUntil(h, m) {
  const now = new Date();
  const then = new Date(now);
  then.setHours(h, m, 0, 0);
  return (then - now) / 60000;
}

function getVisible() {
  return schedule
    .map(b => ({ ...b, mins: getMinsUntil(b.h, b.m) }))
    .filter(b => b.mins > -1 && b.mins < 40)
    .sort((a, b) => a.mins - b.mins);
}

function render() {
  const visible = getVisible();
  const totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
  if (currentPage >= totalPages) currentPage = 0;
  const page = visible.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);

  const dotsEl = document.getElementById('dots');
  if (totalPages > 1) {
    dotsEl.innerHTML = Array.from({length: totalPages}, (_, i) =>
      `<div class="dot${i === currentPage ? ' active' : ''}"></div>`).join('');
    dotsEl.style.display = 'flex';
  } else {
    dotsEl.style.display = 'none';
  }

  if (!visible.length) {
    document.getElementById('list').innerHTML = '<div class="no-buses">No buses in the next 40 minutes<br><span style="font-size:14px;font-weight:400;color:#3a6a90;">Δεν υπάρχουν λεωφορεία τα επόμενα 40 λεπτά</span></div>';
    return;
  }

  document.getElementById('list').innerHTML = page.map(b => {
    const isNow = b.mins < 1;
    const cls = isNow ? 'mins-now' : b.mins <= 10 ? 'mins-soon' : b.mins <= 20 ? 'mins-later' : 'mins-far';
    const label = isNow ? 'NOW / ΤΩΡΑ' : Math.round(b.mins) + ' min';
    return `<div class="row${isNow ? ' now-row' : ''}">
      <div class="line-num">${b.line}</div>
      <div class="destination">
        <div class="dest-en">${b.en}</div>
        <div class="dest-gr">${b.gr}</div>
      </div>
      <div class="mins-col">
        ${isNow ? '<div class="arrows">&#8964;<br>&#8964;</div>' : ''}
        <div class="mins-num ${cls}">${label}</div>
      </div>
    </div>`;
  }).join('');
}

function schedulePage() {
  clearTimeout(pageTimer);
  const delay = currentPage === 0 ? 15000 : 10000;
  pageTimer = setTimeout(() => {
    const visible = getVisible();
    const total = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    if (total > 1) {
      currentPage = (currentPage + 1) % total;
      render();
    }
    schedulePage();
  }, delay);
}

function tick() {
  const n = new Date();
  document.getElementById('clk').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('dt').textContent =
    days[n.getDay()] + ' ' + n.getDate() + ' ' + months[n.getMonth()];
  render();
}

tick();
schedulePage();
setInterval(tick, 15000);
